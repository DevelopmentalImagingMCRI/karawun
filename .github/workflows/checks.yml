# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: KarawunTesting

on:
  push:
  pull_request:
    branches:
      - master
      - release
      - dev
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to publish'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  testmatrix:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14, macos-latest, windows-latest]
        python: [3.14]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "${{ matrix.python }}"
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        python -m pytest -s tests/
    - name: Print branch name
      run: echo ${{ github.ref }}
  all_tests_successful:
    runs-on: ubuntu-latest
    needs: testmatrix
    steps:
    - run: echo Done!        
  packageupload:
    if:  ${{ github.event_name == 'release' && github.event.action == 'published' }} 
    needs: all_tests_successful
    strategy:
      matrix:
        python: [3.14]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0   # versioneer needs full history/tags to compute the version
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "${{ matrix.python }}"
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --upgrade build
    - name: Build package
      run: |
        python3 -m build
    - name: Publish to pypi
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}

  packageuploadtest: # this will fail unless a tag is chosen for the source of the workflow.
    if:  ${{ github.event_name == 'workflow_dispatch' }} 
    needs: all_tests_successful
    strategy:
      matrix:
        python: [3.14]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0   # versioneer needs full history/tags to compute the version
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "${{ matrix.python }}"
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --upgrade build
    - name: Build package
      run: |
        python3 -m build
    - name: Publish to pypi
      if: ${{ github.event.inputs.target == 'pypi' }}
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
    - name: Publish to test
      if: ${{ github.event.inputs.target == 'testpypi' }}
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
      with:
        user: __token__
        password: ${{ secrets.TESTPYPI_API_TOKEN }}
        repository-url: https://test.pypi.org/legacy/

